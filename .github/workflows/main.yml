name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Fixing Gradle & Constraints)
        run: |
          flutter build apk --debug --no-pub --no-tree-shake-icons || true
          flutter build bundle || true

      - name: Force Build APK
        run: |
          cd android || exit 0
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode none

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/app/outputs/flutter-apk/*.apk'
