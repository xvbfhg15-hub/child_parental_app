name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Find and Upload APK
        run: |
          # البحث عن ملف APK في أي مكان داخل المجلد
          path_to_apk=$(find . -name "*.apk" | head -n 1)
          echo "Found APK at: $path_to_apk"
          
          # رفع الملف باستخدام أداة actions/upload-artifact@v4
          # (هنا سنستخدم curl أو نترك الـ Action يقوم بالمهمة)
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: '**/*.apk'
