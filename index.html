<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة مراقبة الطفل</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-top: 15px; border: 1px solid #334155; }
    .alert-item { background: #334155; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>لوحة التحكم المباشرة (الوالدين)</h2>
  <div class="card">
    <h3>التنبيهات الواردة:</h3>
    <div id="alertsContainer">جاري الاتصال بـ Firebase...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsRl3Pc3eEJgrgZLYtDZ-91Ir5MzFMw8c",
      authDomain: "parentalcontrol-f192f.firebaseapp.com",
      databaseURL: "https://parentalcontrol-f192f-default-rtdb.firebaseio.com",
      projectId: "parentalcontrol-f192f",
      storageBucket: "parentalcontrol-f192f.firebasestorage.app",
      messagingSenderId: "375107383090",
      appId: "1:375107383090:web:2818ec6aec79fd95fcb12b",
      measurementId: "G-RDT7S5G4CP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const alertsRef = ref(db, 'alerts');
    onValue(alertsRef, (snapshot) => {
      const container = document.getElementById('alertsContainer');
      container.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        Object.keys(data).forEach(key => {
          const item = data[key];
          const div = document.createElement('div');
          div.className = 'alert-item';
          div.innerHTML = `<strong>${item.message || 'تنبيه'}</strong> <br><small>${item.time || ''}</small>`;
          container.appendChild(div);
        });
      } else {
        container.innerHTML = 'لا توجد تنبيهات حالياً.';
      }
    });
  </script>
</body>
</html>
